name: Loan Default MLOps CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile api/main.py
          python -m py_compile src/mlflow_tracking.py
          python -m py_compile src/register_model.py
          python -m py_compile monitoring/monitor.py

      - name: Build Docker image
        run: |
          docker build -t loan-default-api:ci .

      - name: CI completed
        run: |
          echo "Loan Default MLOps CI completed successfully"