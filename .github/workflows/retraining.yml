name: Loan Default Auto Retraining

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "Loan_default.csv"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check training notebook
        run: |
          python -m py_compile src/mlflow_tracking.py
          python -m py_compile src/register_model.py

      - name: Retraining pipeline started
        run: |
          echo "Loan Default model retraining pipeline started"
          echo "Dataset change detected or workflow manually triggered"

      - name: Retraining pipeline completed
        run: |
          echo "Loan Default MLOps retraining pipeline completed"