name: Loan Default Auto Retraining

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "Loan_default.csv"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retraining
        run: |
          python src/retrain.py

      - name: Upload retrained model
        uses: actions/upload-artifact@v4
        with:
          name: retrained-loan-model
          path: loan_models/random_forest_model.joblib

      - name: Retraining completed
        run: |
          echo "Loan Default MLOps retraining completed successfully"